site_dir: server/docs
site_name: axon
site_url: https://ntfy.sh
site_description: AI-native push notifications — an axon fork of ntfy. Send push notifications to your phone via PUT/POST.
copyright: axon is a fork of ntfy, made with ❤️ by Philipp C. Heckel and the ntfy community
repo_name: binwiederhier/ntfy
repo_url: https://github.com/binwiederhier/ntfy
edit_uri: blob/main/docs/

theme:
  name: material
  font: false
  language: en
  custom_dir: docs/_overrides
  logo: static/img/ntfy.png
  favicon: static/img/favicon.ico
  include_search_page: false
  search_index_only: true
  palette:
    - media: "(prefers-color-scheme: light)"  # Light mode
      scheme: default
      toggle:
        icon: material/lightbulb-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"  # Dark mode
      scheme: slate
      accent: indigo
      toggle:
        icon: material/lightbulb
        name: Switch to light mode
  features:
    - search.suggest
    - search.highlight
    - search.share
    - navigation.sections
    - toc.integrate
    - content.tabs.link
extra:
  homepage: /
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/binwiederhier
extra_javascript:
  - static/js/extra.js
  - static/js/bcrypt.js
  - static/js/config-generator.js
  - static/js/topic-generator.js
extra_css:
  - static/css/extra.css
  - static/css/config-generator.css
  - static/css/topic-generator.css

markdown_extensions:
  - admonition
  - meta
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences
  - pymdownx.highlight:
      extend_pygments_lang:
        - name: php-inline
          lang: php
          options:
            startinline: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - docs/hooks.py

plugins:
  - search
  - minify:
      minify_html: true

nav:
  - "Getting started": index.md
  - "Publishing":
      - "Sending messages": publish.md
  - "Subscribing":
      - "From your phone": subscribe/phone.md
      - "From the Web app": subscribe/web.md
      - "From the Desktop": subscribe/pwa.md
      - "From the CLI": subscribe/cli.md
      - "Using the API": subscribe/api.md
  - "Self-hosting":
      - "Installation": install.md
      - "Configuration": config.md
  - "AI fork plan":
      - "Overview & phase index": ai-plan/index.md
      - "Phase 0 — Foundation": ai-plan/phase-0-foundation.md
      - "Phase 1 — AI provider layer": ai-plan/phase-1-ai-provider-layer.md
      - "Phase 2 — AI subscription setup": ai-plan/phase-2-ai-subscription-setup.md
      - "Phase 3 — Smart delivery": ai-plan/phase-3-smart-delivery.md
      - "Phase 4 — Digests & briefings": ai-plan/phase-4-digests-briefings.md
      - "Phase 5 — Chat with notifications": ai-plan/phase-5-chat-with-notifications.md
      - "Phase 6 — Agents & MCP": ai-plan/phase-6-agents-mcp.md
      - "Phase 7 — Mobile, hardening & release": ai-plan/phase-7-mobile-privacy-release.md
      - "Upstream sync policy": ai-plan/upstream-sync.md
  - "Other things":
      - "FAQs": faq.md
      - "Examples": examples.md
      - "AI agents (MCP)": agents.md
      - "Integrations + projects": integrations.md
      - "Release notes": releases.md
      - "Emojis 🥳 🎉": emojis.md
      - "Template functions": publish/template-functions.md
      - "Troubleshooting": troubleshooting.md
      - "Known issues": known-issues.md
      - "Deprecation notices": deprecations.md
      - "Development": develop.md
      - "Contributing": contributing.md
      - "Privacy policy": privacy.md
      - "Terms of Service": terms.md
      - "Contact": contact.md


