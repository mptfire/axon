name: release

# axon fork: builds static Linux binaries (amd64 + arm64) for axon release tags
# and attaches them to a GitHub Release. Replaces upstream's goreleaser pipeline,
# which targets upstream's Docker Hub and docs repositories.
on:
  push:
    tags:
      - 'v*-axon*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: '.go-version'

      - name: Install node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './web/package-lock.json'

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build docs (embedded in binary)
        run: make docs

      - name: Build web app (embedded in binary)
        run: make web

      - name: Create empty libatomic_asneeded stub (aarch64 spec quirk; Go uses native atomics)
        run: |
          mkdir -p /tmp/empty-libatomic
          cd /tmp/empty-libatomic
          aarch64-linux-gnu-ar rcs libatomic_asneeded.a

      - name: Build linux-amd64 (static)
        run: |
          CGO_ENABLED=1 go build -tags sqlite_omit_load_extension,osusergo,netgo \
            -ldflags "-linkmode=external -extldflags=-static -s -w -X main.version=${{ github.ref_name }}" \
            -o axon-linux-amd64 .

      - name: Build linux-arm64 (static)
        run: |
          SYSROOT="" # Ubuntu's cross gcc carries its own aarch64 include paths
          CGO_ENABLED=1 CC=aarch64-linux-gnu-gcc GOOS=linux GOARCH=arm64 \
            go build -tags sqlite_omit_load_extension,osusergo,netgo \
            -ldflags "-linkmode=external -extldflags '-static -L/tmp/empty-libatomic' -s -w -X main.version=${{ github.ref_name }}" \
            -o axon-linux-arm64 .

      - name: Smoke-test binaries
        run: |
          ./axon-linux-amd64 --help > /dev/null
          echo "amd64 OK"

      - name: Create release and attach artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" axon-linux-amd64 axon-linux-arm64 --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" axon-linux-amd64 axon-linux-arm64 \
              --repo "$GITHUB_REPOSITORY" \
              --title "axon $GITHUB_REF_NAME" \
              --generate-notes
          fi
