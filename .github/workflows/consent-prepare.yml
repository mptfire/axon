name: consent preparation
on: [pull_request]
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'fix/ai-account-consent' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Generate and format review files
        run: |
          cd web
          npm install --save-dev --package-lock-only --ignore-scripts jsdom@30.1.2
          npm ci
          cd ..
          python3 - <<'PY'
          import base64, json, pathlib, subprocess
          subprocess.check_call(["gofmt", "-w", *["ai/ai.go","db/db.go","user/types.go","user/manager_sqlite.go","user/manager_sqlite_schema.go","user/manager_postgres.go","user/manager_postgres_schema.go","user/manager_ai.go","server/server.go","server/errors.go","server/server_ai.go","server/server_digest.go","server/server_ai_consent.go","server/server_ai_test.go","server/server_ai_chat_test.go","server/server_ai_digest_test.go","server/server_ai_briefing_test.go","server/server_digest_test.go","server/server_ai_accounting_test.go","server/server_ai_consent_repro_test.go","server/server_ai_consent_test.go","user/manager_ai_test.go"]])
          subprocess.check_call(["npx", "prettier", *["src/app/AiApi.js","src/app/errors.js","src/components/AiConsentGate.jsx","src/components/AiPrivacySettings.jsx","src/components/AiSubscribeDialog.jsx","src/components/AiChatDialog.jsx","src/components/AiDigestDialog.jsx","src/components/AiBriefingDialog.jsx","src/components/AiTuneDialog.jsx","src/components/Preferences.jsx","public/static/langs/en.json","src/test/setup.js","package.json","src/app/AiApi.test.js","src/components/AiConsentGate.test.jsx"], "--write"], cwd="web")
          changed = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=AM"]).decode().splitlines()
          for path in changed:
              print("AXON_FILE_BEGIN " + path, flush=True)
              data = pathlib.Path(path).read_bytes()
              for offset in range(0, len(data), 4096):
                  print("AXON_FILE_CHUNK " + base64.b64encode(data[offset:offset+4096]).decode(), flush=True)
              print("AXON_FILE_END", flush=True)
          PY
